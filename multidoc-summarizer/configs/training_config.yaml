# Prototype configuration. Conservative on purpose; adapt after reading GPU memory.
model:
  name: allenai/PRIMERA          # general pretrained checkpoint (NOT allenai/PRIMERA-multinews)
  gradient_checkpointing: true

data:
  # Multi-News raw files (script-free loader; no load_dataset script)
  base_url: https://huggingface.co/datasets/multi_news/resolve/main/data
  doc_sep: "|||||"
  newline_token: "NEWLINE_CHAR"
  train_size: 512                # small prototype subset
  val_size: 32
  test_size: 64
  seed: 42

tokenization:
  max_input_len: 2048            # total encoder budget; per-doc = (this - mask_num)//n_docs
  max_output_len: 256
  mask_num: 0                    # 0 for fine-tuning (PRIMERA pretraining used 5)

training:
  learning_rate: 2.0e-5
  weight_decay: 0.01
  per_device_batch_size: 1
  grad_accum: 8
  epochs: 1
  warmup_steps: 50
  max_grad_norm: 1.0
  fp16: true
  bf16: false
  label_smoothing: 0.0
  logging_steps: 5
  save_steps: 25
  eval_steps: 25
  seed: 42
  resume: false

generation:
  max_length: 256
  min_length: 32
  num_beams: 4
  no_repeat_ngram_size: 3
  length_penalty: 2.0
  early_stopping: true
