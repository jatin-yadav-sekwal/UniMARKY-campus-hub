name = "unimarky-campus-hub"
main = "server/app.ts"
compatibility_date = "2024-02-08"
compatibility_flags = ["nodejs_compat"]

[vars]
# Public variables here if any

# Secrets like DATABASE_URL should be set via `wrangler secret put DATABASE_URL`

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1