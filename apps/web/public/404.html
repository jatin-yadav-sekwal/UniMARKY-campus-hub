<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found | UniMARKY</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #f7f6f3;
        color: #262522;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      main { max-width: 560px; }
      .index {
        margin: 0 0 18px;
        color: #3157d5;
        font: 400 10px 'DM Mono', monospace;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 14px;
        font: 400 clamp(32px, 6vw, 46px)/1.08 'Space Grotesk', sans-serif;
        letter-spacing: -.04em;
      }
      p { margin: 0 0 26px; color: #66625c; line-height: 1.7; }
      nav { display: flex; flex-wrap: wrap; gap: 18px; }
      a {
        color: #2949b4;
        font-size: 14px;
        text-decoration: none;
        border-bottom: 1px solid rgba(49, 87, 213, .35);
        padding-bottom: 3px;
      }
      a:hover { border-color: #2949b4; }
    </style>
  </head>
  <body>
    <main>
      <p class="index">404 / Not found</p>
      <h1>This page went missing.</h1>
      <p>
        The link may be outdated, or the page may have moved. Head back to the
        campus or pick a service below.
      </p>
      <nav>
        <a href="/">Home</a>
        <a href="/marketplace">Marketplace</a>
        <a href="/communities">Communities</a>
        <a href="/study">Study</a>
        <a href="/housing">Accommodation</a>
        <a href="/food">Food</a>
        <a href="/lost-found">Lost &amp; Found</a>
        <a href="/contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
